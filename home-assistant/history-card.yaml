  name: Fuel economy
  icon: mdi:gauge
- entity: sensor.chevrolet_volt_ev_trip_consumption
  name: Trip consumption
  icon: mdi:speedometer
- type: divider
- entity: sensor.chevrolet_volt_ev_battery_temperature
  name: Battery temperature
